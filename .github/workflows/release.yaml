name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.10.1)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update manifest.json
        run: |
          jq --arg v "${{ inputs.version }}" \
            '.version = $v' \
            custom_components/lghorizon/manifest.json > tmp.json \
            && mv tmp.json custom_components/lghorizon/manifest.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/lghorizon/manifest.json
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "Bump manifest version to ${{ inputs.version }}"
          git push origin dev

      - name: Create tag and release
        run: |
          gh release create "v${{ inputs.version }}" \
            --target dev \
            --title "v${{ inputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
