name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.10.1)"
        required: true
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update manifest.json
        run: |
          jq --arg v "${{ inputs.version }}" \
            '.version = $v' \
            custom_components/lghorizon/manifest.json > tmp.json \
            && mv tmp.json custom_components/lghorizon/manifest.json

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          commit-message: "Bump manifest version to ${{ inputs.version }}"
          branch: auto/release-${{ inputs.version }}
          base: dev
          title: "Release v${{ inputs.version }}"
          body: |
            Automated version bump to `${{ inputs.version }}`.
            Merging this PR will create the GitHub release automatically.
          delete-branch: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
