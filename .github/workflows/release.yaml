name: Create release
run-name: "${{ inputs.version != '' && format('Release v{0}', inputs.version) || format('Release ({0} bump)', inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Override version (leave empty for auto-bump)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ secrets.PAT }}

      - name: Calculate version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            CURRENT=$(jq -r '.version' custom_components/lghorizon/manifest.json)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing version: $(cat "$GITHUB_OUTPUT" | grep version | cut -d= -f2)"

      - name: Update manifest.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
            '.version = $v' \
            custom_components/lghorizon/manifest.json > tmp.json \
            && mv tmp.json custom_components/lghorizon/manifest.json

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/lghorizon/manifest.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Bump manifest version to ${{ steps.version.outputs.version }}"
          git push origin dev

      - name: Create GitHub release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target dev \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.PAT }}
